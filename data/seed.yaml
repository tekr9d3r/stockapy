# Venues named in research that we have NOT been able to confirm as live stock-earn
# opportunities. Shown on the site as a watchlist, never as a row with a number next to it.
watchlist:
  - platform: Euler
    chain: Ethereum
    status: Unconfirmed
    note: >-
      Listed as carrying xStocks and Ondo vaults. As of 19 Oct 2026 DefiLlama reports no
      tokenized-equity pools under euler-v2, so we cannot confirm a supply-side rate.
    url: https://app.euler.finance
  - platform: Loopscale
    chain: Solana
    status: Unconfirmed
    note: >-
      Fixed-rate order-book lending. No tokenized-equity markets visible in DefiLlama's
      loopscale-lending pools as of 19 Oct 2026.
    url: https://app.loopscale.com
  - platform: Bybit
    chain: CeFi
    status: Trading only
    note: >-
      Bybit lists nine xStocks for spot trading (NVDAX, AAPLX, TSLAX, METAX, GOOGLX,
      AMZNX, COINX, CRCLX, HOODX) but does not pay yield on any of them. Its public earn
      API returned 260 flexible-savings products on 19 Oct 2026 and not one is a
      tokenized stock.
    url: https://www.bybit.com/en/earn
  - platform: Bitrue
    chain: CeFi
    status: Trading only
    note: >-
      Bitrue lists tokenized stocks from Ondo, xStocks and bStocks, plus 3x leveraged
      versions. Its Power Piggy savings product covers crypto such as XRP, and we found
      no evidence on 19 Oct 2026 that any tokenized stock is eligible for it.
    url: https://www.bitrue.com
  - platform: Venus
    chain: BNB Chain
    status: Collateral only
    note: Launched with bStocks as collateral and borrowing paused.
    url: https://app.venus.io
  - platform: Lista DAO
    chain: BNB Chain
    status: Unconfirmed
    note: Tracked for bStocks support.
    url: https://lista.org
  - platform: Aster
    chain: BNB Chain
    status: Trading collateral
    note: bStocks usable as trading collateral, not an earn product.
    url: https://www.asterdex.com
