# StockAPY seed data — the source of truth for WHAT EXISTS.
# Live numbers (APY, TVL) come from data/snapshots/latest.json, never from this file,
# except for `manual` entries where no API exists.
#
# Rules:
#   - Never invent an APY, TVL or contract address. Unknown = null + a todo note.
#   - `verified: true` means a human opened the URL and confirmed the opportunity is live.
#   - `external_id` is the DefiLlama pool UUID. Resolved by scripts/discover.ts.

