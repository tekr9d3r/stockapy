issuers:
  - id: xstocks
    name: xStocks
    website: https://xstocks.com
    structure_note: >-
      Issued by Backed Finance (Switzerland) and distributed by Kraken. Each token is
      backed 1:1 by the underlying share held by a custodian. Token holders have a claim
      on the issuer, not direct share ownership, and no voting rights.
  - id: ondo
    name: Ondo Global Markets
    website: https://ondo.finance
    structure_note: >-
      Ondo Global Markets tokens are backed 1:1 by shares held by a broker-dealer.
      Redemption is available to verified non-US participants.
  - id: coinbase
    name: Coinbase
    website: https://www.coinbase.com
    structure_note: >-
      Coinbase tokenized equities on Base. Backed 1:1 and redeemable through Coinbase
      for eligible users.
  - id: robinhood
    name: Robinhood
    website: https://robinhood.com
    structure_note: >-
      Robinhood Stock Tokens, issued to EU customers and settled on Robinhood Chain.
      Tokens track the share price; holders are contractually exposed, not shareholders.
  - id: cryptocom-issuer
    name: Crypto.com (Foris Capital)
    website: https://crypto.com
    structure_note: >-
      Tokenized stocks issued by Foris Capital MU Ltd, 1:1 collateralised with shares held
      in regulated US custody. Crypto.com does not disclose a public blockchain for them,
      so treat them as custodial balances inside the app rather than tokens you can
      withdraw on-chain. They confer no ownership or shareholder rights.
  - id: binance
    name: Binance (bStocks)
    website: https://www.binance.com
    structure_note: >-
      bStocks on BNB Chain. Not yet live as a stock-earn venue; tracked on the watchlist.

platforms:
  - id: kamino
    name: Kamino Lend
    kind: defi
    website: https://kamino.com
    description: >-
      Solana lending market. The xStocks Market is an isolated market where tokenized
      stocks can be supplied and borrowed against.
  - id: jupiter-lend
    name: Jupiter Lend
    kind: defi
    website: https://jup.ag/lend
    description: >-
      Lending inside the Jupiter app on Solana. xStocks vaults are paired against a
      single borrow asset (USDC or JupUSD).
  - id: superform
    name: Superform
    kind: defi
    website: https://app.superform.xyz
    description: >-
      SuperVaults wrap a strategy behind a single deposit. The SuperStocks vaults take a
      Coinbase tokenized equity and run a leveraged loop against USDC on Aave.
  - id: morpho
    name: Morpho
    kind: defi
    website: https://app.morpho.org
    description: >-
      Permissionless isolated lending markets. In Morpho Blue the collateral asset is not
      lent out, so supplying a stock as collateral earns nothing.
  - id: aave
    name: Aave
    kind: defi
    website: https://app.aave.com
    description: >-
      The Aave V4 Equities Hub on Base accepts Coinbase tokenized equities as collateral.
      Interest is paid to USDC suppliers, not to equity depositors.
  - id: euler
    name: Euler
    kind: defi
    website: https://app.euler.finance
    description: >-
      Modular lending on Ethereum. Some vaults list tokenized equities.
  - id: loopscale
    name: Loopscale
    kind: defi
    website: https://app.loopscale.com
    description: >-
      Order-book style fixed-rate lending on Solana. Rates depend on a borrower matching
      your offer, so advertised rates are often not fillable in size.
  - id: kraken
    name: Kraken
    kind: cefi
    website: https://www.kraken.com
    description: >-
      Kraken xStocks Vaults, built on Veda BoringVault contracts on Ink. Yield is paid
      in kind and withdrawals take roughly three days.
  - id: bitrue
    name: Bitrue
    kind: cefi
    website: https://www.bitrue.com
    description: Flexible staking on tokenized stocks, no lock-up.
  - id: cryptocom
    name: Crypto.com
    kind: cefi
    website: https://crypto.com
    description: Stocks Earn, a flexible product on Crypto.com tokenized stocks.
  - id: bybit
    name: Bybit
    kind: cefi
    website: https://www.bybit.com
    description: >-
      Dual Asset, a fixed-term structured product. Not a simple deposit — the asset you
      get back depends on the price at settlement.

