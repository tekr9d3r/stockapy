name: Refresh yield data

on:
  schedule:
    # Hourly. Keep in sync with REFRESH_INTERVAL_SECONDS in src/config.ts.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits: a moved tag cannot change what runs
      # with write access to the repo. Bump deliberately (comment = version).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero if every source failed, which leaves the last good
      # snapshot in place rather than committing an empty one.
      - run: npm run fetch

      - name: Commit the snapshot
        run: |
          git config user.name "stockapy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/snapshots
          if git diff --staged --quiet; then
            echo "No change in the data."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            # The fetch takes minutes; someone may push to main meanwhile. Replay
            # this commit on top of the latest main and retry. If both touched a
            # snapshot file, this run's fresher data wins ("theirs" in a rebase
            # is the commit being replayed).
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              echo "Push attempt $attempt failed, retrying in 10s."
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            echo "Could not push the snapshot after 3 attempts."
            exit 1
          fi
